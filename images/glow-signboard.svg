<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#nightBg)"/>
  <!-- Wall texture -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1E293B" stroke-width="2"/>
  <rect x="0" y="420" width="800" height="180" fill="#0B132B"/>
  <!-- Signboard housing -->
  <rect x="100" y="160" width="600" height="200" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="6"/>
  <!-- Inner Glow Face -->
  <rect x="114" y="174" width="572" height="172" rx="8" fill="#09090B"/>
  <rect x="120" y="180" width="560" height="160" rx="6" fill="#F8FAFC" fill-opacity="0.04"/>
  <!-- Glowing Text -->
  <g filter="url(#glow)">
    <text x="400" y="255" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="2">SMART ADVERTISING</text>
    <text x="400" y="300" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="4">LED &amp; ACRYLIC GLOW SIGNS</text>
  </g>
  <!-- Fasteners -->
  <circle cx="120" cy="180" r="5" fill="#71717A"/>
  <circle cx="680" cy="180" r="5" fill="#71717A"/>
  <circle cx="120" cy="340" r="5" fill="#71717A"/>
  <circle cx="680" cy="340" r="5" fill="#71717A"/>
  <!-- Light throw on pavement -->
  <ellipse cx="400" cy="460" rx="280" ry="24" fill="#38BDF8" fill-opacity="0.08"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <!-- Card Back -->
  <g transform="translate(180, 160) rotate(-8)" filter="url(#shadow)">
    <rect width="420" height="240" rx="16" fill="#FFFFFF"/>
    <rect x="30" y="40" width="60" height="60" rx="12" fill="#E2E8F0"/>
    <rect x="110" y="45" width="160" height="18" rx="4" fill="#0F172A"/>
    <rect x="110" y="75" width="100" height="12" rx="3" fill="#64748B"/>
    <line x1="30" y1="130" x2="390" y2="130" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="30" y="155" width="180" height="10" rx="3" fill="#94A3B8"/>
    <rect x="30" y="175" width="140" height="10" rx="3" fill="#94A3B8"/>
    <circle cx="370" cy="190" r="14" fill="#2563EB"/>
  </g>
  <!-- Card Front -->
  <g transform="translate(240, 200) rotate(6)" filter="url(#shadow)">
    <rect width="420" height="240" rx="16" fill="url(#cardGrad)"/>
    <circle cx="360" cy="50" r="80" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="40" y="45" width="48" height="48" rx="10" fill="#FFFFFF"/>
    <path d="M52 69 L64 57 L76 69" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="105" y="66" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">SMART ADVERTISING</text>
    <text x="105" y="86" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="13">Premium Visiting Cards &amp; Stationery</text>
    <rect x="40" y="130" width="160" height="14" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="40" y="155" width="220" height="10" rx="3" fill="#BFDBFE"/>
    <rect x="40" y="175" width="180" height="10" rx="3" fill="#BFDBFE"/>
    <text x="40" y="215" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11">Matte / Gloss / Velvet / Spot UV</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  <!-- Ground -->
  <rect x="0" y="480" width="800" height="120" fill="#334155"/>
  <rect x="0" y="470" width="800" height="14" fill="#15803D"/>
  <!-- Steel Truss Poles -->
  <rect x="220" y="320" width="18" height="180" fill="#475569"/>
  <rect x="560" y="320" width="18" height="180" fill="#475569"/>
  <line x1="220" y1="360" x2="238" y2="390" stroke="#64748B" stroke-width="3"/>
  <line x1="220" y1="420" x2="238" y2="450" stroke="#64748B" stroke-width="3"/>
  <line x1="560" y1="360" x2="578" y2="390" stroke="#64748B" stroke-width="3"/>
  <line x1="560" y1="420" x2="578" y2="450" stroke="#64748B" stroke-width="3"/>
  <!-- Billboard Frame & Lighting arms -->
  <rect x="110" y="80" width="580" height="260" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="6"/>
  <!-- Spotlight fixtures on top -->
  <line x1="200" y1="80" x2="200" y2="55" stroke="#475569" stroke-width="4"/>
  <polygon points="190,55 210,55 215,48 185,48" fill="#334155"/>
  <line x1="400" y1="80" x2="400" y2="55" stroke="#475569" stroke-width="4"/>
  <polygon points="390,55 410,55 415,48 385,48" fill="#334155"/>
  <line x1="600" y1="80" x2="600" y2="55" stroke="#475569" stroke-width="4"/>
  <polygon points="590,55 610,55 615,48 585,48" fill="#334155"/>
  <!-- Billboard Canvas Print -->
  <rect x="124" y="94" width="552" height="232" fill="url(#bannerBg)"/>
  <text x="400" y="165" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle">HIGHWAY HOARDING PRINTS</text>
  <text x="400" y="205" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Heavy-Duty Frontlit &amp; Star Flex</text>
  <rect x="250" y="235" width="300" height="42" rx="8" fill="#FFFFFF"/>
  <text x="400" y="262" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Weatherproof • UV Resistant • High Res</text>
</svg>
